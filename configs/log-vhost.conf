# Lives at /etc/nginx/conf.d/log-vhost.conf on manda.
# Standard combined log format with the request Host prepended, used to
# track hostname migrations (phish.rmis.org -> api.rmis.org, 2026-08-03).
log_format vhost '$host $remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent"';
