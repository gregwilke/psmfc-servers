server
{
    listen 80;
    listen [::]:80;

    listen              443 ssl;

    server_name phish.rmis.org;
    ssl_certificate     /etc/ssl/certs/www.rmpc.org.crt;
    ssl_certificate_key /etc/ssl/private/www.rmpc.org.key;

    # RMIS-next cutover 2026-07-22: the four replayed GET data routes are
    # served by the engine-based rmis-next (:5002); everything else (bauth,
    # files, docs, description, total, valid) stays on legacy rmis-api
    # (:5001) until rmis-next covers those surfaces.
    # Rollback: point these routes back to 5001 (backup of the pre-cutover
    # conf: /var/nodejs/phish.rmis.org.conf.pre-next-cutover).
    location ~ ^/(recovery|location|catchsample|release)$ {

        proxy_pass http://127.0.0.1:5002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Access-Control-Allow-Origin *;

        include /etc/nginx/proxy_params;

        client_max_body_size 100M;

        # Set Content Security Policy for all requests
        add_header Content-Security-Policy "frame-ancestors 'self' https://www.rmpc.org" always;
    }

    location / {

        proxy_pass http://127.0.0.1:5001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Access-Control-Allow-Origin *;

        include /etc/nginx/proxy_params;

        client_max_body_size 100M;

        # Set Content Security Policy for all requests
        add_header Content-Security-Policy "frame-ancestors 'self' https://www.rmpc.org" always;
    }

}
