server
{
    listen 80;
    listen [::]:80;

    listen              443 ssl;

    # api.rmis.org migration (2026-08-03): api.rmis.org is the new public
    # name; phish.rmis.org stays live during the transition so existing
    # users don't break. Both names get identical routing. api.rmis.org
    # goes live externally once IT adds DNS + cert SAN + IIS ARR binding.
    # The vhost access log records $host per request to track how much
    # traffic still uses the old name (format in conf.d/log-vhost.conf).
    server_name phish.rmis.org api.rmis.org;
    ssl_certificate     /etc/ssl/certs/www.rmpc.org.crt;
    ssl_certificate_key /etc/ssl/private/www.rmpc.org.key;

    access_log /var/log/nginx/rmis-api.access.log vhost;

    # RMIS-next cutover, staged. Stage 1 (2026-07-22): four GET data routes
    # -> rmis-next (:5002). Stage 1b (2026-07-24): /description after the
    # track-3 replay gate. Stage 2 (2026-07-24): /bauth + /docs tree.
    # Stage 3 (2026-07-24): /files. Full-surface parity: legacy (:5001)
    # keeps only /total and /valid (dropped from next on this deployment -
    # zero observed traffic) and stays running as the instant rollback.
    # Rollback: point these routes back to 5001 (backup of the pre-cutover
    # conf: /var/nodejs/phish.rmis.org.conf.pre-next-cutover).
    # Data routes take an optional /:id segment (by-id surface, engine
    # v0.14.0, 2026-07-25); bauth/files stay exact-match.
    location ~ ^/(recovery|location|catchsample|release|description)(/[^/]+)?$|^/(bauth|files|valid)$|^/docs(/|$) {

        proxy_pass http://127.0.0.1:5002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Access-Control-Allow-Origin *;

        include /etc/nginx/proxy_params;

        client_max_body_size 100M;

        # Set Content Security Policy for all requests
        add_header Content-Security-Policy "frame-ancestors 'self' https://www.rmpc.org" always;
    }

    location / {

        proxy_pass http://127.0.0.1:5001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Access-Control-Allow-Origin *;

        include /etc/nginx/proxy_params;

        client_max_body_size 100M;

        # Set Content Security Policy for all requests
        add_header Content-Security-Policy "frame-ancestors 'self' https://www.rmpc.org" always;
    }

}
